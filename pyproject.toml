[project]
name = "stochast-dashboard"
version = "0.1.0"
description = "A live web dashboard for watching a stochast run in progress."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "stochast",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "matplotlib>=3.8",
]

[project.scripts]
stochast-dashboard = "stochast_dashboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stochast_dashboard"]

[tool.uv.sources]
stochast = { path = "../Stochast", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
